nameOverride: ""
fullnameOverride: ""

namespace:
  name: tenant-lambda

# Default secret names used by every Function unless overridden per-function.
# Create these Secrets in the tenant namespace (bootstrap script / Sealed Secrets).
imageCredentials:
  name: push-secret

gitCredentials:
  name: git-repo-secret

build:
  builder: openfunction/gcp-builder:v1

serving:
  runtime: knative
  imagePullPolicy: IfNotPresent

# Legacy inline-secret rendering — disabled in favour of ExternalSecrets below.
secrets:
  enabled: false

# External Secrets Operator — fetches credentials from AWS Secrets Manager (local)
# or Vault (production) and creates push-secret / git-repo-secret in each namespace.
#
# AWS Secrets Manager layout (local):
#   openfunction/registry  →  { server, username, password }
#   openfunction/git       →  { username, password }
#
# Vault layout (production):
#   openfunction/registry  →  same keys
#   openfunction/git       →  same keys
#
# To switch stores, change storeRef.name to "vault" (and deploy cluster-secret-store-vault.yaml).
externalSecrets:
  enabled: true
  refreshInterval: "1h"
  storeRef:
    name: aws-secretsmanager   # swap to "vault" in production
    kind: ClusterSecretStore
  registrySecretKey: openfunction/registry
  gitSecretKey: openfunction/git

# Per-function values. Omit imageCredentials / git credentials / builder / serving
# to inherit the defaults above. Override only when a function needs something different.
functions: []
