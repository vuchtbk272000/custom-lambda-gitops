{{- if .Values.externalSecrets.enabled }}
---
# ExternalSecret — Docker registry credentials (push-secret)
# ESO fetches from AWS Secrets Manager (local) or Vault (prod) and creates
# a kubernetes.io/dockerconfigjson Secret in this tenant namespace automatically.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.imageCredentials.name }}-eso
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "function-template.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.storeRef.name }}
    kind: {{ .Values.externalSecrets.storeRef.kind | default "ClusterSecretStore" }}
  target:
    name: {{ .Values.imageCredentials.name }}
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      metadata:
        annotations:
          build.shipwright.io/referenced.secret: "true"
      engineVersion: v2
      data:
        .dockerconfigjson: |
          {
            "auths": {
              "{{ `{{ .server }}` }}": {
                "username": "{{ `{{ .username }}` }}",
                "password": "{{ `{{ .password }}` }}",
                "auth": "{{ `{{ printf "%s:%s" .username .password | b64enc }}` }}"
              }
            }
          }
  data:
    - secretKey: server
      remoteRef:
        key: {{ .Values.externalSecrets.registrySecretKey }}
        property: server
    - secretKey: username
      remoteRef:
        key: {{ .Values.externalSecrets.registrySecretKey }}
        property: username
    - secretKey: password
      remoteRef:
        key: {{ .Values.externalSecrets.registrySecretKey }}
        property: password
---
# ExternalSecret — Git credentials (git-repo-secret)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.gitCredentials.name }}-eso
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "function-template.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.storeRef.name }}
    kind: {{ .Values.externalSecrets.storeRef.kind | default "ClusterSecretStore" }}
  target:
    name: {{ .Values.gitCredentials.name }}
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      metadata:
        annotations:
          build.shipwright.io/referenced.secret: "true"
  data:
    - secretKey: username
      remoteRef:
        key: {{ .Values.externalSecrets.gitSecretKey }}
        property: username
    - secretKey: password
      remoteRef:
        key: {{ .Values.externalSecrets.gitSecretKey }}
        property: password
{{- end }}
