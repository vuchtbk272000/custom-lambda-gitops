function-template:
  nameOverride: "tenant-a"
  fullnameOverride: "tenant-a"

  namespace:
    name: tenant-a-lambda

  # Inherits defaults from function-template:
  #   imageCredentials.name: push-secret
  #   gitCredentials.name: git-repo-secret
  #   build.builder / serving.*
  # Override those keys here only when this tenant needs different secrets or defaults.

  functions:
    - name: function-1
      version: "v1.0.0"
      image: "vuxucam/openfunction-python-helloworld:v1"
      build:
        env:
          GOOGLE_FUNCTION_TARGET: "hello_world"
          GOOGLE_FUNCTION_SIGNATURE_TYPE: "http"
          GOOGLE_FUNCTION_SOURCE: "main.py"
        srcRepo:
          url: "https://github.com/vuchtbk272000/openfunction-python-helloworld.git"
          sourceSubPath: "function-1"
          revision: "abfb598c7c22f6ea0c0f003f3c0b230a8d137fd7"

    - name: function-2
      version: "v1.0.0"
      image: "vuxucam/openfunction-python-helloworld:v1"
      build:
        env:
          GOOGLE_FUNCTION_TARGET: "hello_world"
          GOOGLE_FUNCTION_SIGNATURE_TYPE: "http"
          GOOGLE_FUNCTION_SOURCE: "main.py"
        srcRepo:
          url: "https://github.com/vuchtbk272000/openfunction-python-helloworld.git"
          sourceSubPath: "function-2"
          revision: "903404ca9edf48461d18e5cc24635248f944f964"
